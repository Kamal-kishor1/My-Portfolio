services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT=production}
      DATABASE_URL: ${DATABASE_URL:?Set Neon DATABASE_URL}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?Set Neon DATABASE_URL_UNPOOLED}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set Neon Object Storage access key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set Neon Object Storage secret key}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:?Set Neon Object Storage endpoint}
      AWS_PUBLIC_ENDPOINT_URL_S3: ${AWS_PUBLIC_ENDPOINT_URL_S3:-}
      AWS_REGION: ${AWS_REGION:?Set Neon Object Storage region}
      NEON_STORAGE_BUCKET: ${NEON_STORAGE_BUCKET:?Set Neon Object Storage bucket}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5/minute}
      CONTACT_RATE_LIMIT: ${CONTACT_RATE_LIMIT:-20/hour}
      ANALYTICS_RATE_LIMIT: ${ANALYTICS_RATE_LIMIT:-60/minute}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      CONTACT_NOTIFICATION_TO: ${CONTACT_NOTIFICATION_TO:-}
      CONTACT_NOTIFICATION_DRY_RUN: ${CONTACT_NOTIFICATION_DRY_RUN:-false}
      TRUST_CLOUDFLARE_CLIENT_IP: ${TRUST_CLOUDFLARE_CLIENT_IP:-false}
    expose:
      - "8002"
    ports:
      - "127.0.0.1:${API_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8002"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Set the public API URL}
        VITE_ENVIRONMENT: production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3001"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
